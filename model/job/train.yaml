# 모델 재학습 Job 명세 (템플릿) — 원본
#
# 놓는 곳: NFS /home/suhan/manifests/job/train.yaml  (화면에서는 job/train.yaml)
#   플랫폼 API 가 [학습 시작] 을 누를 때마다 이 파일을 읽어 Job 을 create 한다 (k8sapimd/train.md 5-2).
#   - metadata.name → generateName "<name>-" 으로 바뀌어 실행마다 새 Job (train-xxxxx)
#   - namespace · 라벨 platform.mentor/job-type: train 은 API 가 강제로 붙임
#   - API 가 첫 컨테이너의 env DATASET 을 화면에서 고른 데이터셋 이름으로 채움 (그 외 값은 이 파일 그대로)
#   - 저장 즉시 다음 실행부터 반영 (apply 불필요). 실행 중인 Job 에는 영향 없음
#   - 매니페스트 관리 화면에서 이 파일을 [apply] 하면 DATASET 이 비어 있어 바로 실패한다 (정상 — 화면 버튼으로 실행)
apiVersion: batch/v1
kind: Job
metadata:
  name: train
  labels:
    app.kubernetes.io/part-of: mlops-platform
    platform.mentor/job-type: train            # 화면 목록·동시 실행 검사
spec:
  backoffLimit: 0                              # 데이터 문제는 재시도해도 같음
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600                 # 끝나고 10분 뒤 Job·파드 자동 삭제 (기록은 MLflow 에 남음)
  template:
    metadata:
      labels:
        platform.mentor/job-type: train
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false      # 쿠버네티스 권한 불필요
      securityContext: {runAsUser: 1000, runAsGroup: 1000, runAsNonRoot: true}
      containers:
        - name: train
          image: suhannugul/mentor:job-train_v1
          imagePullPolicy: IfNotPresent
          env:
            - {name: DATASET, value: ""}                 # ← API 가 채움 (seed 또는 dataset-YYYYMMDD-HHMMSS)
            - {name: CSV_DIR, value: /csv}
            - {name: EVAL_FILE, value: eval.csv}         # 고정 평가셋 — 바꾸면 버전 간 지표 비교 불가
            - {name: MIN_PER_LABEL, value: "20"}         # 정리 후 라벨별 최소 행 수
            - {name: FEEDBACK_WEIGHT, value: "3"}        # DB 피드백 행 가중치 (train.md 4-4)
            - {name: MLFLOW_TRACKING_URI, value: http://mlflow.mentor.svc.cluster.local:5000}
            - {name: MLFLOW_EXPERIMENT_NAME, value: toxicity-filter}
            - {name: REGISTERED_MODEL, value: toxicity-filter}
            - {name: IMAGE, value: suhannugul/mentor:job-train_v1}   # 기록용 (image 를 바꾸면 같이 바꿈)
            - {name: HOME, value: /tmp}
            - {name: GIT_PYTHON_REFRESH, value: quiet}
            - name: JOB_NAME
              valueFrom: {fieldRef: {fieldPath: "metadata.labels['job-name']"}}
          terminationMessagePolicy: FallbackToLogsOnError    # 결과 요약 JSON → 화면이 읽음
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: csv, mountPath: /csv, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: csv
          persistentVolumeClaim: {claimName: mentor-csv, readOnly: true}
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
