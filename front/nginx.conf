# 화면(정적 파일) 서버 — API 는 Ingress 가 플랫폼 서버로 보내므로 여기서는 정적 파일만
server {
    listen 8080;                      # 비루트 nginx 이미지 → 1024 미만 포트 사용 불가
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 매번 서버에 최신 여부를 확인하게 함 (ETag 로 바뀐 것만 다시 받음)
    # → 새 버전 배포 후 브라우저가 예전 JS 를 계속 실행하는 문제 방지 (개발 중 실제로 겪은 중복 저장 버그)
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 쿠버네티스 probe 용 (Ingress 의 /healthz 는 플랫폼 API 로 가므로 이름을 다르게)
    location = /web-healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
